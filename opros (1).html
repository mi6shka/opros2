<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опрос</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px 14px;background:#f8f6fb;font-family:Inter,'Segoe UI',Arial,sans-serif;color:#302a38}.poll{max-width:600px;margin:20px auto;padding:clamp(20px,5vw,34px);background:white;border:1px solid #ece6f2;border-radius:18px;box-shadow:0 8px 30px #603f990a}.tag{color:#7958a7;font-size:10px;font-weight:600;letter-spacing:1.8px;margin-bottom:17px}h1{font-size:clamp(18px,3vw,22px);font-weight:500;line-height:1.48;letter-spacing:-.3px;margin:0 0 24px}.option{display:flex;align-items:center;gap:13px;border:1px solid #e6e0ed;border-radius:10px;padding:14px 15px;margin:9px 0;cursor:pointer;font-size:13px;line-height:1.55}.option:hover{border-color:#a991cb}.option:has(input:checked){border-color:#603F99;background:#f4effa}.option input{accent-color:#603F99;width:18px;height:18px;margin:0;flex:none}button{width:100%;border:0;border-radius:10px;background:#603F99;color:white;padding:13px;margin-top:15px;font:500 13px Inter,'Segoe UI',Arial,sans-serif;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.total{color:#603F99;font-size:13px;font-weight:600;margin-bottom:23px}.result{margin-bottom:19px}.line{display:flex;justify-content:space-between;gap:12px;font-size:12px;line-height:1.5;margin-bottom:8px}.line strong{white-space:nowrap}.track{height:8px;background:#eee8f5;border-radius:8px;overflow:hidden}.fill{height:100%;background:#603F99;border-radius:8px}.foot{text-align:center;color:#89818f;font-size:11px;margin-top:17px;line-height:1.5}[hidden]{display:none!important}
</style>
</head>
<body>
<main class="poll"><div class="tag">ОПРОС</div><h1>Кто у вас в компании сейчас отвечает за уведомления от госорганов?</h1><form id="form"><div id="options"></div><button id="vote" disabled>Проголосовать</button></form><section id="results" hidden aria-live="polite"><div id="total" class="total"></div><div id="rows"></div></section><p class="foot" id="foot">Выберите один вариант ответа</p></main>
<script>
(()=>{
const answers=['директор','секретарь-ассистент','мы, юристы','руководители департаментов по своим направлениям','у нас таких ответственных нет'];
const countsKey='gov_poll_counts_v1',voteKey='gov_poll_my_vote_v1';
const form=document.getElementById('form'),options=document.getElementById('options'),vote=document.getElementById('vote'),results=document.getElementById('results'),total=document.getElementById('total'),rows=document.getElementById('rows'),foot=document.getElementById('foot');
function getCounts(){try{const c=JSON.parse(localStorage.getItem(countsKey));if(Array.isArray(c)&&c.length===5&&c.every(n=>Number.isInteger(n)&&n>=0))return c}catch(e){}return [0,0,0,0,0]}
function getVote(){try{const v=localStorage.getItem(voteKey);if(v!==null&&Number.isInteger(+v)&&+v>=0&&+v<5)return +v}catch(e){}return null}
function plural(n){if(n%100>=11&&n%100<=14)return 'голосов';if(n%10===1)return 'голос';if(n%10>=2&&n%10<=4)return 'голоса';return 'голосов'}
answers.forEach((a,i)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='answer';input.value=i;const text=document.createElement('span');text.textContent=a;label.append(input,text);options.append(label)});
form.addEventListener('change',()=>vote.disabled=false);
function show(){const counts=getCounts(),n=counts.reduce((a,b)=>a+b,0);form.hidden=true;results.hidden=false;total.textContent=`Всего: ${n} ${plural(n)} ·`;rows.replaceChildren();answers.forEach((a,i)=>{const pct=n?Math.round(counts[i]/n*100):0;const item=document.createElement('div');item.className='result';const line=document.createElement('div');line.className='line';const name=document.createElement('span');name.textContent=a;const number=document.createElement('strong');number.textContent=`${counts[i]} · ${pct}%`;line.append(name,number);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=pct+'%';track.append(fill);item.append(line,track);rows.append(item)});foot.textContent='Анонимное голосование · результаты сохранены на этом устройстве'}
form.addEventListener('submit',e=>{e.preventDefault();if(getVote()!==null){show();return}const selected=form.querySelector('input[name="answer"]:checked');if(!selected)return;const i=+selected.value,c=getCounts();c[i]++;try{localStorage.setItem(countsKey,JSON.stringify(c));localStorage.setItem(voteKey,String(i));show()}catch(e){foot.textContent='Не удалось сохранить результат: проверьте настройки браузера'}});
if(getVote()!==null)show();
})();
</script>
</body></html>
